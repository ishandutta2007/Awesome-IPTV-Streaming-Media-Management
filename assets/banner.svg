<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Glowing Orb Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-20px) translateX(15px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 250px 200px;
      }
      .orb-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 950px 180px;
      }
      .flow-line {
        stroke-dasharray: 20, 15;
        animation: streamFlow 12s linear infinite;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere in background -->
  <circle cx="240" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" class="orb-1" />
  <circle cx="960" cy="200" r="160" fill="#a855f7" filter="url(#glow)" class="orb-2" />
  <circle cx="600" cy="300" r="120" fill="#6366f1" filter="url(#glow)" opacity="0.25" />

  <!-- Subtle Digital Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Streaming Dynamic Waves in Background (behind text) -->
  <path d="M -50 320 Q 300 240 600 310 T 1250 260" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" class="flow-line" />
  <path d="M -50 280 Q 350 360 700 270 T 1250 320" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="flow-line" style="animation-duration: 18s;" />

  <!-- Floating Stream Data Nodes -->
  <circle cx="180" cy="110" r="4" fill="#38bdf8" class="particle-1" />
  <circle cx="1020" cy="120" r="5" fill="#c084fc" class="particle-2" />
  <circle cx="880" cy="310" r="3.5" fill="#818cf8" class="particle-3" />
  <circle cx="320" cy="320" r="4" fill="#38bdf8" class="particle-2" />

  <!-- Top Badge / Header Tag -->
  <g transform="translate(600, 65)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" filter="url(#badgeGlow)" />
    <circle cx="-115" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="5" fill="#e2e8f0" class="pill-text">CURATED STREAMING ARCHITECTURE</text>
  </g>

  <!-- Main Title (Guaranteed Foreground Layer) -->
  <!-- Subtle dark drop shadow for high contrast -->
  <text x="600" y="162" text-anchor="middle" fill="#000000" opacity="0.6" font-size="46" class="title-text" dy="2">
    Awesome IPTV &amp; Streaming Media Management
  </text>
  <text x="600" y="160" text-anchor="middle" fill="url(#accentGrad)" font-size="46" class="title-text">
    Awesome IPTV &amp; Streaming Media Management
  </text>

  <!-- Subtitle (Guaranteed Foreground Layer) -->
  <text x="600" y="212" text-anchor="middle" fill="#94a3b8" font-size="18" class="subtitle-text">
    High-Performance Players • M3U/Xtream Proxies • EPG Scrapers • Live DVR • Virtual Linear Channels
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Media Servers -->
    <g transform="translate(-400, 0)">
      <rect x="-75" y="-20" width="150" height="40" rx="10" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="pill-text">📺 Media Servers</text>
    </g>

    <!-- Pill 2: IPTV Proxies -->
    <g transform="translate(-200, 0)">
      <rect x="-75" y="-20" width="150" height="40" rx="10" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#818cf8" class="pill-text">⚡ IPTV Proxies</text>
    </g>

    <!-- Pill 3: EPG & XMLTV -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-20" width="150" height="40" rx="10" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#a855f7" class="pill-text">📋 EPG &amp; XMLTV</text>
    </g>

    <!-- Pill 4: Live DVR -->
    <g transform="translate(200, 0)">
      <rect x="-75" y="-20" width="150" height="40" rx="10" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#ec4899" class="pill-text">📼 Live DVR</text>
    </g>

    <!-- Pill 5: Channel Automation -->
    <g transform="translate(400, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="10" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#34d399" class="pill-text">📡 Virtual Channels</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
